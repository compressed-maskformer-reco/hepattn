# Overlay on base.yaml: patch attention (PHAT-JeT, arXiv:2605.21789, without its geometric message passing) in the
# encoder only. Each layer attends exactly within patches of 16 consecutive constituents, then the masked-mean patch
# tokens and the register tokens attend to each other and each patch token is broadcast back to its constituents.
# The encoder still returns one embedding per constituent in input order, so the decoder, tasks and matching are
# base.yaml's, unchanged.
#
# Constituents are ordered by their azimuth at the calorimeter (phi_calo: a track's phi_int, a topo cluster's phi),
# going round the circle from each event's largest empty phi gap (input_sort_period), so that a track and its own
# showers, and nodes either side of phi = +-pi, tend to share a patch. On 4959 validation events this puts 65% of the
# node pairs of a target particle in one patch of 16, against 54% for raw (perigee) phi and 21% for a random order.
name: clic_patch_p16_phicalo

model:
  model:
    init_args:
      input_sort_field: phi_calo
      input_sort_period: 6.283185307179586 # 2 pi
      encoder:
        init_args:
          # PatchEncoderLayer; within each patch it runs the torch backend (flash-varlen cannot mask per patch)
          attn_type: patch
          patch_size: 16 # data.max_nodes (160) = 10 patches
          patch_global: true
