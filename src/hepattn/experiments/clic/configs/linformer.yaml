# Overlay on base.yaml: masked-linformer in the encoder self-attention, over constituents sorted by phi.
# The decoder keeps ordinary attention: its mask attention is per query and cannot pass through a sequence projection.
name: clic_linformer_phi

model:
  model:
    init_args:
      input_sort_field: phi
      encoder:
        init_args:
          attn_type: linformer
          attn_kwargs:
            num_heads: 16
            linformer_seq_len: 168 # data.max_nodes (160) + num_register_tokens (8)
            linformer_k: 64
