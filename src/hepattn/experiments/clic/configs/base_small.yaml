# Paper-tag code (clic-paper = fb90390) at the SMALL (v7) model width.
#
# This is `base.yaml` with the model narrowed to the v7 spec and NOTHING else changed.
# Purpose: a one-variable capacity ablation on the paper's own code. Task 1 already showed
# that shrinking the *drifted HEAD* model 14x leaves the inverted rising jet-E IQR intact
# (capacity is not the cause there); this asks the mirror question on the code that actually
# reproduces Fig. 4 — does the paper-tag model keep its falling IQR when it is made small?
#
# Diff vs base.yaml (5 edits, all width):
#   1. dim               256 -> 64      (anchor; propagates to input net, posenc, encoder,
#                                        decoder layers, class head input, mask task dim,
#                                        and the incidence head's [*dim, *dim] / [*dim])
#   2. encoder num_heads  16 -> 8
#   3. decoder num_heads  16 -> 8
#   4. class head hidden  [256, 128, 32]           -> [64, 128, 32]
#   5. regression head    input 518 -> 134 (= 2*dim + 6), hidden
#                         [512, 256, 128, 64, 32]  -> [128, 128, 128, 64, 32]
#
# Edits 2-5 are v7's own values (see ../../../../hepattn/src/hepattn/experiments/clic/
# configs/CONFIGS.md). Edit 1 does the rest via the anchor.
#
# NOTE the incidence head stays [*dim, *dim] -> [64, 64], i.e. the PAPER's structure at the
# new width. Do not copy v7's `hidden_layers: 2` shorthand here: this Dense has no int
# shorthand (it takes lists only), and at HEAD that shorthand expands to
# [input_size * hidden_dim_scale] = [128, 128] -- importing the post-paper incidence
# widening that is itself a prime suspect for the IQR regression. That would confound the
# very thing this run is meant to isolate.
#
# Unchanged from the paper-tag reference run: 6-enc/4-dec depth, 150 queries, 8 registers,
# Lion @ 8e-5, 200 epochs, bf16-mixed, flash-varlen, batch_size 170 (global 1020 over 6 L4),
# same data. batch_size is deliberately NOT raised for the smaller model -- the LR is not
# batch-scaled, so changing it would move a second variable.

name: clic_paper_small
seed_everything: 42

data:
  inputs:
    hit:
      - "x"
      - "y"
      - "z"
      - "r"
      - "s"
      - "theta"
      - "phi"

  targets:
    particle:
      - e
      - pt
      - eta
      - sinphi
      - cosphi

  num_objects: &num_particles 150

  # HPG data paths (patched from the authors' /share/gpu1/... paths — same dataset, same filenames).
  # test_path uses our common-infer file (test is not used during `fit`).
  train_path: /cmsuf/data/store/user/mmazza/hepattn_clic_data/train_clic_fix.root
  valid_path: /cmsuf/data/store/user/mmazza/hepattn_clic_data/val_clic_fix.root
  test_path: /cmsuf/data/store/user/mmazza/hepattn_clic_data/test_clic_common_infer.root

  num_workers: 16
  num_train: -1
  num_test: -1
  num_val: 5000

  # 170/GPU x 6 L4 = global 1020 ~= paper's 512x2=1024 (paper ran 2x A100; L4 can't hold 512/GPU).
  batch_size: 170
  incidence_cutval: 0.01

  scale_dict_path: &scale_dict_path configs/clic_var_transform.yaml

trainer:
  max_epochs: 200
  accelerator: gpu
  devices: 2
  precision: bf16-mixed
  gradient_clip_val: 0.1
  log_every_n_steps: 50
  default_root_dir: logs
  enable_progress_bar: True

  logger:
    class_path: lightning.pytorch.loggers.CometLogger
    init_args:
      project_name: hepattn-clic

  callbacks:
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.callbacks.InferenceTimer
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        save_last: true
        # every_n_train_steps: 1000
    - class_path: hepattn.experiments.clic.PflowPredictionWriter
      # init_args:
      #   write_inputs: true
      #   write_outputs: true
      #   write_preds: true
      #   write_targets: true
      #   write_losses: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 50

model:
  optimizer: Lion

  lrs_config:
    initial: 1e-6
    max: 8e-5
    end: 1e-6
    pct_start: 0.05
    weight_decay: 1e-4
    skip_scheduler: false

  mtl: false

  model:
    class_path: hepattn.models.MaskFormer
    init_args:
      dim: &dim 64                        # (1) 256 -> 64
      raw_variables:
        - "node_e"
        - "node_pt"
        - "node_eta"
        - "node_sinphi"
        - "node_cosphi"
        - "node_is_track"

      input_nets:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.InputNet
              init_args:
                input_name: node
                fields:
                  - features
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 27
                    output_size: *dim
                posenc:
                  class_path: hepattn.models.posenc.FourierPositionEncoder
                  init_args:
                    input_name: node
                    dim: *dim
                    fields: [eta, phi]
                    scale: 0.1

      encoder:
        class_path: hepattn.models.Encoder
        init_args:
          num_layers: 6
          dim: *dim
          attn_type: flash-varlen
          hybrid_norm: true
          value_residual: true
          num_register_tokens: 8
          attn_kwargs:
            num_heads: 8                  # (2) 16 -> 8

      decoder:
        num_decoder_layers: 4
        num_queries: *num_particles
        mask_attention: true
        use_query_masks: false
        decoder_layer_config:
          dim: *dim
          hybrid_norm: true
          attn_kwargs:
            num_heads: 8                  # (3) 16 -> 8

      matcher:
        class_path: hepattn.models.matcher.Matcher
        init_args:
          default_solver: scipy
          adaptive_solver: false
          parallel_solver: true
          n_jobs: 16

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: hepattn.models.task.ObjectClassificationTask
              init_args:
                name: classification
                input_object: query
                output_object: pflow
                target_object: particle
                num_classes: 5
                losses:
                  object_ce: 2
                costs:
                  object_ce: 2
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    activation: torch.nn.SiLU
                    output_size: 6
                    hidden_layers: [64, 128, 32]     # (4) [256, 128, 32] -> [64, 128, 32]
                null_weight: 0.5
                loss_class_weights: [1.0, 3.0, 8.0, 1.5, 1.0]
                mask_queries: false
                has_intermediate_loss: true

            - class_path: hepattn.models.task.ObjectHitMaskTask
              init_args:
                name: mask
                input_hit: node
                input_object: query
                output_object: pflow
                target_object: particle
                pred_threshold: 0.1
                logit_scale: 4
                losses:
                  mask_bce: 5.0
                  mask_dice: 1.0
                costs:
                  # mask_bce: 5.0
                  mask_dice: 1.0
                dim: *dim
                null_weight: 1.0
                has_intermediate_loss: true

            - class_path: hepattn.models.task.IncidenceRegressionTask
              init_args:
                name: incidence
                input_hit: node
                input_object: query
                output_object: pflow
                target_object: particle
                losses:
                  kl_div: 1.0
                costs:
                  kl_div: 1.0
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    activation: torch.nn.SiLU
                    output_size: *dim
                    hidden_layers: [*dim, *dim]      # paper structure at width 64 -> [64, 64]
                node_net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: *dim
                    output_size: *dim
                    hidden_layers: [*dim]            # -> [64]
                has_intermediate_loss: false

            - class_path: hepattn.models.task.IncidenceBasedRegressionTask
              init_args:
                name: regression
                fields: ["e", "pt", "eta", "sinphi", "cosphi"]
                input_hit: node
                input_object: query
                output_object: pflow
                target_object: particle
                loss: l1
                loss_weight: 10.0
                cost_weight: 10.0
                use_incidence: true
                use_nodes: true
                cost: new
                mode: scale
                scale_dict_path: *scale_dict_path
                net:
                  class_path: hepattn.models.Dense
                  init_args:
                    input_size: 134                  # (5) 518 -> 134 (= 2*dim + 6 raw node vars)
                    activation: torch.nn.SiLU
                    output_size: 5
                    hidden_layers: [128, 128, 128, 64, 32]   # was [512, 256, 128, 64, 32]
                has_intermediate_loss: false
