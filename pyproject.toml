[project]
authors = [{name = "Sam Van Stroud", email = "sam.van.stroud@cern.ch"}]
description = "Attention for High Energy Physics"
license = { text = "MIT" }
readme = "README.md"
name = "hepattn"
requires-python = "== 3.12"
version = "0.1.0"
dependencies = [
    "packaging",
    "jupyter",
    "ipykernel",
    "wheel",
    "numpy",
    "scipy",
    "energyflow",
    "pathos",
    "vector",
    "fastjet",
    "atlas-ftag-tools",
    "pytest>=8.3.3,<9",
    "pytest-repeat",
    "ruff==0.12.4",
    "pre-commit>=4.0.1,<5",
    "matplotlib==3.9.*",
    "lightning==2.5.0.post0",
    "comet-ml>=3.47.3,<4",
    "pandas>=2.2.3,<3",
    "pyarrow>=17.0.0",
    "jsonargparse[signatures]>=4.34.0,<5",
    "torchjd>=0.5.0",
    "lion-pytorch>=0.2.3,<0.3",
    "awkward>=2.8.1",
    "uproot>=5.6.0",
    "h5py>=3.13.0",
    "particle>=0.25.3",
    "scikit-learn>=1.6.1,<2",
    "numba>=0.61.2",
    "onnx>=1.18.0",
    "onnxruntime>=1.22.0",
]

[dependency-groups]
clic = ["pathos", "vector", "fastjet", "energyflow"] # has problems on isambard
tide = ["numba>=0.61.2"] # has problems on isambard
fa2 = ["flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.4.17/flash_attn-2.8.3%2Bcu128torch2.9-cp312-cp312-linux_x86_64.whl"]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/hepattn", "src/lap1015/src/lap1015"]

# Pixi passes its own `pixi-conda-environment` config-setting to the build backend. Under
# scikit-build-core's default strict checking that is a hard error, so `pixi install` on a
# fresh clone fails outright and the compiled `lap1015` extension never gets built.
# Downgrading unknown config-settings to a warning is the documented escape hatch.
strict-config = false

# NOT set here, deliberately: `editable.rebuild = true`. It sounds like the fix for an editable
# install whose compiled .so has gone stale against main.cpp, but the import hook it installs
# runs under the *system* cmake, which cannot find the Python development headers -- so every
# `import lap1015` fails outright, which is strictly worse than a stale .so. Rebuild explicitly
# with `pixi reinstall hepattn`.

[tool.pixi.workspace]
channels = ["conda-forge", "nvidia", "nodefaults"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
hepattn = { path = ".", editable = true }

[tool.pixi.pypi-options]
no-build-isolation = ["flash-attn"]

[tool.pixi.feature.gpu.pypi-dependencies]
torch = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cu128"}

[tool.pixi.feature.cpu.pypi-dependencies]
torch = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.environments]
default = { features = ["gpu", "fa2"] }
isambard = { features = ["gpu"] }
cpu = { features = ["cpu"] }
clic = { features = ["gpu", "fa2", "clic"] }
tide = { features = ["tide"] }
ci = { features = ["cpu", "clic", "tide"]}

[tool.pixi.system-requirements]
libc = "2.28"
cuda = "12.3"

[tool.pixi.dependencies]
python = "3.12.*"
gxx = ">=14.3.0,<14.4"
git = ">=2.51.0,<3"
git-lfs = ">=3.7.0,<4"
ninja = ">=1.13.1,<2"
cuda = "12.8.*"
"ruamel.yaml" = ">=0.18.10,<0.19"

[tool.pixi.tasks.test]
cmd = "pytest -xsv"

[tool.pixi.tasks.test-ci]
cmd = "pytest -xsv -m 'not gpu and not requiresdata'"

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 150
preview = true

[tool.ruff.lint]
select = ["ALL"]

ignore = ["G", "D100", "D101", "D102", "D103",  "D104", "D105", "D106", "D107", "D205", "ANN", "PLW", "FBT", "EM",  "PLR2004", "PT018", "COM812", "CPY001", "TRY003", "S101", "N812", "PLR0913", "PLR0917", "DOC201", "INP001", "PLR6301", "T201", "TD002", "TD003", "FIX002", "ARG002", "C901", "PLR0914", "PLR0912", "PLR0915", "PT011", "ERA001", "PGH004", "PLC0206", "S311", "PLR0911", "PLR6104", "S404", "S603", "B028"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*distutils Version classes are deprecated. Use packaging.version instead.*:DeprecationWarning",
]
markers = [
    "gpu: mark test to run on GPU",
    "requiresdata: mark test that requires data not present in the repository",
]
